# Local-development defaults. Authentication and multi-tenancy are intentionally
# disabled; keep these services inside the cluster and access Grafana by port-forward.
grafana:
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin
  service:
    port: 3000
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  image:
    repository: grafana/loki
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  retentionPeriod: 24h
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

tempo:
  image:
    repository: grafana/tempo
    tag: "2.6.1"
    pullPolicy: IfNotPresent
  retentionPeriod: 24h
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mimir:
  image:
    repository: grafana/mimir
    tag: "2.15.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.115.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

