apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s
      flush_check_period: 10s
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retentionPeriod }}
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
