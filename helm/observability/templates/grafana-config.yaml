apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir:9009/prometheus
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: 1h
            spanEndTimeShift: -1h
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: 1h
            spanEndTimeShift: -1h
          nodeGraph:
            enabled: false
          search:
            hide: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: local
        orgId: 1
        folder: Application
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-app-health-dashboard
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  app-health.json: |-
{{ .Files.Get "dashboards/app-health.json" | indent 4 }}
  kubernetes-services.json: |-
{{ .Files.Get "dashboards/kubernetes-services.json" | indent 4 }}
