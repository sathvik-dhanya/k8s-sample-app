apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  loki.yaml: |
    # Single-tenant local development only; keep Loki private to the cluster.
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      allow_structured_metadata: true
      retention_period: {{ .Values.loki.retentionPeriod }}
    analytics:
      reporting_enabled: false
