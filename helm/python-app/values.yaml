# Default values file for python-app.
# This is just an example, values are not guaranteed to be correct for your environment.
replicaCount: 1

image:
  repository: python-app
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80             # The port on which the service will be exposed.
  targetPort: 8080     # The port on which the application container is listening.

telemetry:
  enabled: false
  serviceName: python-app
  # OTLP/gRPC collector address; Make overrides this for a custom namespace.
  endpoint: otel-collector.observability.svc.cluster.local:4317
  traceSampleRatio: "1.0"

# Synthetic latency and failure routes are disabled except in local-dev values.
simulation:
  enabled: false

# By default, do not enable the gateway and httpRoute resources.
# These are typically only enabled in a local dev environment
# where a gateway is needed to route traffic to the application locally.
# In a production environment, the gateway would typically be disabled and
# the httpRoute would be configured to use an existing shared gateway.
gateway:
  enabled: false

httpRoute:
  enabled: false

probes:
  liveness:
    path: /healthz/live
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    path: /healthz/ready
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
