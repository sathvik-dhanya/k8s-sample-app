{{- if .Values.gateway.enabled -}}
####
# NOTE - The Gateway resource is typically created by the OPS team and the
# values are shared with the dev team. Gateway resource does not live in
# the app helm chart. It is included here for reference and for the example app to work.
# Only the HTTPRoute resource should be created by the app helm chart.
# If you do want to test the app in a local cluster, you can enable the gateway in the
# local dev specific, like values-local-dev.yaml file, and it will be created by the helm chart.
####
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default (include "python-app.fullname" .) .Values.gateway.name }}
  namespace: {{ default .Release.Namespace .Values.gateway.namespace }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      {{- if .hostname }}
      hostname: {{ .hostname }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
