{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  parentRefs:
  {{- if .Values.httpRoute.parentRefs }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- else }}
    - name: {{ default (include "python-app.fullname" .) .Values.gateway.name }}
      namespace: {{ default .Release.Namespace .Values.gateway.namespace }}
      {{- if .Values.gateway.listeners }}
      sectionName: {{ (index .Values.gateway.listeners 0).name }}
      {{- end }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - name: {{ include "python-app.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
